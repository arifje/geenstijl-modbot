{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "modbot.fullname" . }}-web
  labels:
    {{- include "modbot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "modbot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
