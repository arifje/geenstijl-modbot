image:
  repository: ghcr.io/arifje/geenstijl-modbot
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Non-secret configuration, rendered into a ConfigMap.
config:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://modbot.example.com
  # Container output + database (admin → Logs)
  LOG_CHANNEL: stack
  LOG_STACK: stderr,database
  LOG_LEVEL: info
  CACHE_STORE: database
  # Runs started from the admin are queued and picked up by the scheduler.
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: modbot
  MAIL_MAILER: ahasend
  MODBOT_LLM_PROVIDER: anthropic
  MODBOT_LLM_MODEL: claude-opus-5-5
  MODBOT_LLM_EFFORT: medium
  MODBOT_WINDOW_HOURS: "12"
  MODBOT_ARTICLE_LOOKBACK_HOURS: "24"
  MODBOT_APPROVAL_FILTER: unapproved
  # Only seeds the first schedule; schedules are managed in the admin.
  MODBOT_REPORT_CRON: "0 8,20 * * *"
  # Defaults; can be changed in the admin under Settings.
  SLACK_CHANNEL: "#development"
  SLACK_USERNAME: ModBot
  AHASEND_FROM_EMAIL: no-reply@platform.geenstijl.nl
  AHASEND_FROM_NAME: GeenStijl Moderatierapport
  AHASEND_RECIPIENTS: ""

# Secrets: either reference an existing Secret (recommended, e.g. created by
# sealed-secrets or external-secrets) or let the chart create one.
# Expected keys: APP_KEY, DB_USERNAME, DB_PASSWORD, ANTHROPIC_API_KEY,
# SLACK_BOT_TOKEN, AHASEND_API_KEY, AHASEND_ACCOUNT_ID
# Optional: OPENAI_API_KEY, LLM_COMPATIBLE_API_KEY
existingSecret: ""
secret: {}

# Run database migrations in an init container before the scheduler starts.
migrations:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

# Admin panel (Filament) at /admin.
web:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: modbot.example.com
  tls: []
  #  - secretName: modbot-tls
  #    hosts: [modbot.example.com]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
