services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modbot
      POSTGRES_USER: modbot
      POSTGRES_PASSWORD: modbot
    ports:
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modbot"]
      interval: 5s
      retries: 10

  # Same two roles as in Kubernetes.
  # Start with: docker compose --profile app up --build
  scheduler:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    profiles: ["app"]
    command: ["frankenphp", "php-server", "--root", "public/", "--listen", ":8080"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
